[package]
name = "axon-media-engine"
version = "7.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
nvml-wrapper = "0.10"
eframe = { version = "0.24", features = ["glow"] }
rfd = "0.12"
libmpv2 = "5.0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "libloaderapi"] } # Para esconder console no Windows
